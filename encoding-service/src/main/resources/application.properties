spring.application.name=encoding-service
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=encoding-service-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.netflix.encodingservice.event.VideoUploadedEvent
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

server.port=8083

aws.access-key=${AWS_ACCESS_KEY:}
aws.secret-key=${AWS_S3_SECRET_KEY:}
aws.region=${AWS_S3_REGION:us-east-1}
aws.s3.bucket-name=${AWS_BUCKET_NAME:}

ffmpeg.path=${FFMPEG_PATH:/usr/bin/ffmpeg}
encoding.base-path=${ENCODING_BASE_PATH:/tmp/encoding}

management.endpoints.web.exposure.include=health, info
