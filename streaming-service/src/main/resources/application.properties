spring.application.name=streaming-service

server.port=8084

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=streaming-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.netflix.streamingservice.event.VideoEncodedEvent


aws.access-key=${AWS_ACCESS_KEY:}
aws.secret-key=${AWS_S3_SECRET_KEY:}
aws.region=${AWS_S3_REGION:us-east-1}
aws.s3.bucket-name=${AWS_BUCKET_NAME:}
aws.s3.presigned-url-expiry=${AWS_S3_PRESIGNED_URL_EXPIRY:60}


management.endpoints.web.exposure.include=health, info